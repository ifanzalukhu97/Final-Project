<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>CineVerse | Book Tickets</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/color-res.css" />
    <link rel="stylesheet" href="../styles/navbar.css" />
    <link rel="stylesheet" href="../styles/shared-navbar.css" />
    <link rel="stylesheet" href="../styles/booking-ticket.css" />
  </head>
  
  <body class="color-primary-dark">
    <!-- ======= Navbar ====== -->
    <div id="navbar-container">
      <!-- Navigation will be injected here by navbar.js -->
    </div>
    <!-- ====== End of Navbar ====== -->
    
    <!-- ==== Booking Header ==== -->
    <div class="container">
      <div class="booking-header">
        <h2 class="font-secondary">Book Your Tickets</h2>
      </div>
    </div>
    
    <!-- ==== Form Booking Ticket ==== -->
    <div class="container">
      <div class="booking-container">
        <form class="form-booking">
          <!-- Username -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">account_circle</i>
                </div>
              </div>
              <input type="text" class="form-control username" placeholder="Your Name" />
            </div>
          </div>
          
          <!-- Email -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">email</i>
                </div>
              </div>
              <input type="email" class="form-control email" placeholder="Your Email" />
            </div>
          </div>
          
          <!-- Genre -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">category</i>
                </div>
              </div>
              <select class="form-control select-genre">
                <option value="action">Action</option>
                <option>Comedy</option>
                <option>Drama</option>
                <option>Horror</option>
                <option>Romance</option>
              </select>
            </div>
          </div>
          
          <!-- Movie -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">movie</i>
                </div>
              </div>
              <select class="form-control movie-options"></select>
            </div>
          </div>
          
          <!-- Price -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">attach_money</i>
                </div>
              </div>
              <input
                type="number"
                class="form-control movie-price"
                value="0"
                readonly
              />
            </div>
          </div>
          
          <!-- Quantity -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">plus_one</i>
                </div>
              </div>
              <input type="number" class="form-control ticket-movie-qty" placeholder="Quantity" value="1" min="1" required />
            </div>
          </div>
          
          <!-- Total -->
          <div class="form-group booking-group-hidden">
            <div class="input-group">
              <div class="input-group-prepend">
                <div class="form-ticket-icon">
                  <i class="material-icons ticket-icon">local_atm</i>
                </div>
              </div>
              <input
                type="number"
                class="form-control total-payment"
                value="0"
                readonly
              />
            </div>
          </div>
          
          <!-- Submit Button -->
          <div class="form-group booking-group-hidden text-center">
            <button type="button" class="btn btn-booking-ticket" 
                    data-toggle="modal" data-target=".detail-booking-ticket-modal">
              Book Now
            </button>
          </div>
        </form>
      </div>
    </div>
    <!-- ==== End Form Booking Ticket ==== -->

    <!-- === Modal === -->
    <div class="modal fade detail-booking-ticket-modal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title font-secondary">Your Ticket Details</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span class="text-danger" aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="ticket-card">
              <div class="row no-gutters">
                <div class="col-md-4">
                  <div class="ticket-poster-container">
                    <img src="https://image.tmdb.org/t/p/w500/6ba0i86XWO3kMUUrCL7bij6d0Fn.jpg"
                         class="ticket-poster modal-detail-poster" alt="Movie Poster" />
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="ticket-details">
                    <form class="ticket-form" method="POST" action="https://formspree.io/ivan.zalukhu97@gmail.com">
                      <div class="modal-detail-ticket"></div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-cancel modal-btn" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-process modal-btn">Process</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- === End Modal === -->

    <!-- Scripts -->
    <script src="../scripts/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"></script>
    <script src="../components/navbar.js"></script>
    <script src="../db/dbMovies.js"></script>
    <script src="../scripts/booking-ticket.js"></script>
  </body>
</html>
