<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>CineVerse | Elegant Movie Experience</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/color-res.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/navbar.css" />
    <link rel="stylesheet" href="./styles/shared-navbar.css" />
    <link rel="stylesheet" href="./styles/index-custom.css" />
  </head>
  
  <body>
    <!-- Hero Section -->
    <section class="hero-section">
      <!-- Carousel Background -->
      <div class="carousel-container">
        <div id="heroCarousel" class="carousel slide" data-ride="carousel" data-interval="5000">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="./images/slides/1.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
            <div class="carousel-item">
              <img src="./images/slides/2.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
            <div class="carousel-item">
              <img src="./images/slides/3.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
            <div class="carousel-item">
              <img src="./images/slides/4.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
            <div class="carousel-item">
              <img src="./images/slides/5.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
            <div class="carousel-item">
              <img src="./images/slides/6.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
            <div class="carousel-item">
              <img src="./images/slides/7.jpg" class="d-block w-100" alt="Featured Movie">
            </div>
          </div>
        </div>
      </div>
      
      <!-- Hero Content -->
      <div class="hero-content">
        <h1 class="hero-title">CineVerse</h1>
        <p class="hero-subtitle">Discover the ultimate movie experience</p>
        <div class="d-flex flex-wrap justify-content-center">
          <a href="./pages/movie-list.html" class="btn hero-btn">Browse Movies</a>
          <a href="./pages/booking-ticket.html" class="btn hero-btn">Book Tickets</a>
        </div>
      </div>
    </section>

    <!-- Navigation Bar -->
    <div id="navbar-container">
      <!-- Navigation will be injected here by navbar.js -->
    </div>

    <!-- Scripts -->
    <script src="./scripts/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"></script>
    <script src="./components/navbar.js"></script>
    <script src="./scripts/main.js"></script>
  </body>
</html>
